name: Build App Lite (Linux DEB/RPM + Windows + macOS)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest      # Apple Silicon ARM64
          - macos-15-intel    # Intel x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r money_manager_lite/requirements.txt
          pip install pyinstaller

      - name: Install Linux Packaging Tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      # ---------------- WINDOWS ----------------
      - name: Build Windows EXE
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed \
          --name MoneyManager \
          --paths=money_manager_lite \
          --add-data "money_manager_lite/resources;resources" \
          --add-data "money_manager_lite/database;database" \
          --hidden-import PySide6.QtCore \
          --hidden-import PySide6.QtGui \
          --hidden-import PySide6.QtWidgets \
          money_manager_lite/main.py

      # ---------------- LINUX ----------------
      - name: Build Linux Binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed \
          --name MoneyManager \
          --paths=money_manager_lite \
          --add-data "money_manager_lite/resources:resources" \
          --add-data "money_manager_lite/database:database" \
          --hidden-import PySide6.QtCore \
          --hidden-import PySide6.QtGui \
          --hidden-import PySide6.QtWidgets \
          money_manager_lite/main.py

      - name: Build Linux DEB and RPM Packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PACKAGE_VERSION="1.0.${GITHUB_RUN_NUMBER}"
          PACKAGE_ROOT="package-root"

          mkdir -p "$PACKAGE_ROOT/opt/moneymanager-lite"
          mkdir -p "$PACKAGE_ROOT/usr/share/applications"
          mkdir -p "$PACKAGE_ROOT/usr/share/icons/hicolor/256x256/apps"
          mkdir -p packages

          install -m 755 dist/MoneyManager "$PACKAGE_ROOT/opt/moneymanager-lite/MoneyManagerLite"
          install -m 644 money_manager_lite/resources/icons/logo.png "$PACKAGE_ROOT/usr/share/icons/hicolor/256x256/apps/moneymanager-lite.png"

          cat > "$PACKAGE_ROOT/usr/share/applications/moneymanager-lite.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Money Manager Lite
          Comment=Track expenses, budgets, goals, and transactions
          Exec=/opt/moneymanager-lite/MoneyManagerLite
          Icon=moneymanager-lite
          Terminal=false
          Categories=Office;Finance;
          EOF

          fpm -s dir -t deb \
            -n money-manager-lite \
            -v "$PACKAGE_VERSION" \
            --architecture amd64 \
            --description "Money Manager Lite desktop application" \
            --license MIT \
            --url "https://github.com/${GITHUB_REPOSITORY}" \
            -C "$PACKAGE_ROOT" \
            -p "packages/money-manager-lite_${PACKAGE_VERSION}_amd64.deb" \
            .

          fpm -s dir -t rpm \
            -n money-manager-lite \
            -v "$PACKAGE_VERSION" \
            --architecture x86_64 \
            --description "Money Manager Lite desktop application" \
            --license MIT \
            --url "https://github.com/${GITHUB_REPOSITORY}" \
            -C "$PACKAGE_ROOT" \
            -p "packages/money-manager-lite-${PACKAGE_VERSION}-x86_64.rpm" \
            .

      # ---------------- MAC ARM64 ----------------
      - name: Build macOS ARM64 App
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --windowed \
          --name MoneyManager-ARM64 \
          --paths=money_manager_lite \
          --add-data "money_manager_lite/resources:resources" \
          --add-data "money_manager_lite/database:database" \
          --hidden-import PySide6.QtCore \
          --hidden-import PySide6.QtGui \
          --hidden-import PySide6.QtWidgets \
          money_manager_lite/main.py

      - name: Create ARM64 DMG
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir dmg
          cp -R dist/MoneyManager-ARM64.app dmg/
          hdiutil create -volname MoneyManager-ARM64 \
          -srcfolder dmg \
          -ov \
          -format UDZO \
          MoneyManager-ARM64.dmg

      # ---------------- MAC INTEL x64 ----------------
      - name: Build macOS x64 App
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --windowed \
          --name MoneyManager-x64 \
          --paths=money_manager_lite \
          --add-data "money_manager_lite/resources:resources" \
          --add-data "money_manager_lite/database:database" \
          --hidden-import PySide6.QtCore \
          --hidden-import PySide6.QtGui \
          --hidden-import PySide6.QtWidgets \
          money_manager_lite/main.py

      - name: Create x64 DMG
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          mkdir dmg
          cp -R dist/MoneyManager-x64.app dmg/
          hdiutil create -volname MoneyManager-x64 \
          -srcfolder dmg \
          -ov \
          -format UDZO \
          MoneyManager-x64.dmg

      # ---------------- UPLOAD ----------------
      - name: Upload Windows Build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build-Lite
          path: dist/*

      - name: Upload Linux Build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Build-Lite
          path: |
            dist/*
            packages/*.deb
            packages/*.rpm

      - name: Upload macOS ARM64 Build
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macOS-ARM64-Build-Lite
          path: |
            dist/*
            MoneyManager-ARM64.dmg

      - name: Upload macOS x64 Build
        if: matrix.os == 'macos-15-intel'
        uses: actions/upload-artifact@v4
        with:
          name: macOS-x64-Build-Lite
          path: |
            dist/*
            MoneyManager-x64.dmg
